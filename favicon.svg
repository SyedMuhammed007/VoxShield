<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Radiant Gradient -->
    <linearGradient id="shield-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    
    <!-- Outer Shield Border Gradient -->
    <linearGradient id="shield-border" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Inner Soundwave Gradient -->
    <linearGradient id="wave-grad" x1="32" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Core Center Highlight -->
    <linearGradient id="center-core" x1="32" y1="15" x2="32" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="shield-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Base Background with Drop Glow -->
  <path d="M32 3.5L9 12.5V28C9 43.5 19 55.8 32 60.5C45 55.8 55 43.5 55 28V12.5L32 3.5Z" 
        fill="url(#shield-bg)" />

  <!-- Shield Tech Border Highlight -->
  <path d="M32 3.5L9 12.5V28C9 43.5 19 55.8 32 60.5C45 55.8 55 43.5 55 28V12.5L32 3.5Z" 
        stroke="url(#shield-border)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner Cyber Contour Accent -->
  <path d="M32 8L13.5 15.5V27C13.5 39.5 21.5 49.5 32 54.2C42.5 49.5 50.5 39.5 50.5 27V15.5L32 8Z" 
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="3 2" fill="none" />

  <!-- Biometric Voice Equalizer Bars (Representing Live Audio Firewall) -->
  <!-- Outer Left Bar -->
  <rect x="18" y="27" width="3.2" height="10" rx="1.6" fill="url(#wave-grad)" />
  <!-- Mid Left Bar -->
  <rect x="24" y="21" width="3.5" height="22" rx="1.75" fill="url(#wave-grad)" />
  <!-- Center Main Bar (Dominant Signal) -->
  <rect x="30.2" y="15" width="3.6" height="34" rx="1.8" fill="url(#center-core)" filter="url(#shield-glow)" />
  <!-- Mid Right Bar -->
  <rect x="36.5" y="22" width="3.5" height="20" rx="1.75" fill="url(#wave-grad)" />
  <!-- Outer Right Bar -->
  <rect x="42.8" y="28" width="3.2" height="8" rx="1.6" fill="url(#wave-grad)" />

  <!-- Biometric Node Core Dot -->
  <circle cx="32" cy="10.5" r="2.2" fill="#38bdf8" />
</svg>